name: Secret Test
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Secret als Umgebungsvariable verwenden
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -z "$API_KEY" ]; then
            echo "Secret fehlt!"
            exit 1
          fi
          echo "Secret ist gesetzt. Länge: ${#API_KEY} Zeichen"
          echo "Versuch, das Secret auszugeben: $API_KEY"
